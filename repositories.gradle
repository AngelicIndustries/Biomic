// Add any additional repositories for your dependencies here.

repositories {
    maven {
        name = "Angelic Maven"
        url "https://maven.angelic.industries/releases"
    }
    maven {
        name = "FalsePattern Releases"
        url "https://mvn.falsepattern.com/releases"
    }
    maven {
        name = "Solo Studios Releases"
        url "https://maven.solo-studios.ca/releases"
    }
    // MCLib (makamys), shaded for its Asset Director; only it comes from JitPack.
    exclusiveContent {
        forRepository {
            maven {
                name = "JitPack"
                url "https://jitpack.io"
            }
        }
        filter {
            includeGroup("com.github.makamys")
        }
    }
}
